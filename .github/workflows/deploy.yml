name: Deploy Adawaty preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned media runtime
        run: npm ci --ignore-scripts

      - name: Prepare browser media runtime
        run: npm run prepare:media-runtime

      - name: Generate product pages
        run: npm run generate:product

      - name: Validate source and integration tests
        run: npm run validate

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare browser media runtime
        run: |
          npm ci --ignore-scripts
          npm run prepare:media-runtime
      - name: Generate product pages
        run: npm run generate:product
      - name: Remove node_modules before upload
        run: rm -rf node_modules
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
